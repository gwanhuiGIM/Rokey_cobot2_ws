# RealSense D435i 포인트클라우드 → MoveIt octomap (3D 장애물 감지)
#
# 필요: sudo apt install ros-humble-moveit-ros-perception
#       (이게 없으면 PointCloudOctomapUpdater 플러그인 자체가 없어서
#        move_group이 "No 3D sensor plugin(s) defined for octomap updates"를 뱉는다)
#
# 파라미터 이름 근거: libmoveit_ros_occupancy_map_monitor.so의 심볼에서 확인한
# `sensors`, `octomap_frame`, `octomap_resolution`, `<sensor_name>.sensor_plugin`.
# 그 아래 updater 개별 파라미터는 moveit_ros_perception 소스 규약을 따른다.
#
# ⚠️ 아래 튜닝값들은 현장에서 맞춰야 하는 값이다. 도면값이 아니다.
#    포인트클라우드가 로봇 자신을 장애물로 잡아먹거나(padding 부족),
#    반대로 진짜 장애물이 안 잡히면(max_range/resolution) 여기를 먼저 본다.

sensors:
  - realsense_pointcloud

realsense_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater

  # camera.launch.py의 RealSense 노드가 pointcloud.enable=true로 발행하는 토픽
  point_cloud_topic: /camera/camera/depth/color/points

  # [튜닝] 이 거리(m)보다 먼 점은 버린다. 카메라~로봇 거리가 약 1.48 m이므로
  # 2.5 m면 작업영역을 덮는다. 늘리면 뒷벽까지 장애물로 잡혀 계획이 막힌다.
  max_range: 1.5

  # [튜닝] 점 N개마다 1개만 쓴다. 1=전부. CPU가 모자라면 2~3으로 올린다.
  point_subsample: 3

  # [튜닝] 로봇 자기 몸을 클라우드에서 지울 때 링크를 얼마나 부풀릴지.
  # 자기 팔이 장애물로 잡혀 계획이 실패하면 padding_offset을 키운다(단위 m).
  padding_offset: 0.1
  padding_scale: 2.0

  # [튜닝] octomap 갱신 주파수(Hz). 환경이 안 바뀐다는 전제이므로 낮게 잡는다.
  max_update_rate: 1.0

  filtered_cloud_topic: /moveit/filtered_cloud
