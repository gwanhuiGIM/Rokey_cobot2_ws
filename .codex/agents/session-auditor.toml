사용자에게 확인받아야 할 것 (내가 판단할 수 없는 것):
```

## 규칙

- 코드 품질은 보지 마라. `cross-review`의 일이다. 너는 **약속과 이행의 차이**만 본다.
- 인용 못 하는 지적은 하지 마라. 사용자 발언이나 파일:라인을 못 대면 인상이지 감사가 아니다.
- 차이가 없으면 **"차이 없음"이라고 써라.** 표를 채우려 억지로 만들면 진짜 누락이 묻힌다.
- 잘한 점은 쓰지 마라. 이미 안다.'''
