```
목표 (사용자 발언에서 추출, 인용):
판정: 완료 / 부분완료 / 미완료
```

| # | 유형(A/B/C/D) | 항목 | 근거(사용자 발언 인용 또는 파일:라인) | 심각도 |
|---|---|---|---|---|

```
